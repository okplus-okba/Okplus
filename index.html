<style>
  :root{
    --bg:#0a0a0f;
    --card:#17171f;
    --card-hover:#1f1f2a;
    --border:rgba(212,175,55,.16);
    --border-hover:rgba(212,175,55,.55);
    --gold:#e6c15a;
    --gold-lite:#f7e59a;
    --silver:#d9d9de;
    --text:#fff;
    --muted:rgba(255,255,255,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 50% -8%, rgba(212,175,55,.13), transparent 62%),
      radial-gradient(700px 500px at 50% 110%, rgba(212,175,55,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 20px 56px;
  }
  .wrap{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* الشعار */
  .logo{
    width:190px;
    height:auto;
    margin-bottom:6px;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.5));
    animation:rise .7s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .tagline{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    margin:0 0 30px;
    max-width:320px;
  }

  /* عنوان قسم صغير */
  .eyebrow{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    margin:8px 0 14px;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";height:1px;flex:1;
    background:linear-gradient(90deg,transparent,var(--border),transparent);
  }

  /* أزرار التطبيق */
  .apps{width:100%;display:flex;flex-direction:column;gap:12px;}
  a.app{
    display:flex;align-items:center;gap:14px;
    text-decoration:none;color:var(--text);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px 20px;
    transition:transform .12s ease,border-color .15s,background .15s;
    text-align:start;
  }
  a.app:hover,a.app:active{
    transform:translateY(-2px);
    border-color:var(--border-hover);
    background:var(--card-hover);
  }
  a.app svg{width:30px;height:30px;flex-shrink:0;fill:#fff;}
  a.app .t{line-height:1.25;flex:1;}
  a.app .t small{display:block;font-size:12px;color:var(--muted);font-weight:600;}
  a.app .t b{display:block;font-size:16px;font-weight:800;margin-top:1px;}
  a.app.reco{
    border-color:var(--gold);
    background:linear-gradient(135deg,rgba(212,175,55,.14),rgba(212,175,55,.04));
  }
  a.app.reco .t small{color:var(--gold-lite);}

  /* أيقونات التواصل — صف واحد */
  .social{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:6px;
    width:100%;
  }
  a.soc{
    width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--border);
    transition:transform .12s ease,border-color .15s,background .15s;
  }
  a.soc:hover,a.soc:active{
    transform:translateY(-3px);
    border-color:var(--border-hover);
    background:var(--card-hover);
  }
  a.soc svg{width:24px;height:24px;fill:#fff;transition:fill .15s;}
  a.soc:hover svg{fill:var(--gold-lite);}

  .foot{
    margin-top:34px;color:rgba(255,255,255,.3);
    font-size:12px;line-height:1.7;
  }
  .foot a{color:rgba(212,175,55,.65);text-decoration:none;}

  @media (prefers-reduced-motion:reduce){
    .logo{animation:none;}
    a.app,a.soc{transition:none;}
  }
</style>

  (function(){

    var ios=document.getElementById('ios');
    var android=document.getElementById('android');
