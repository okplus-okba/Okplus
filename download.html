<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK Plus DE</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .logo {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 28px;
    background: linear-gradient(135deg, #d4af37, #f5e28c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  a.btn {
    background: linear-gradient(135deg, #d4af37, #f5e28c);
    color: #111;
    font-weight: bold;
    text-decoration: none;
    padding: 18px 48px;
    border-radius: 14px;
    font-size: 1.2rem;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>
<body>
  <div class="logo">OK Plus DE</div>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.okplusde.app">📲 Install</a>
</body>
</html>
